name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      family:
        description: Device family to verify
        type: choice
        options: [all, iPhone, iPad]
        default: all
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: iOS 26 - ${{ matrix.family }}
    runs-on: macos-15-intel
    strategy:
      fail-fast: false
      matrix:
        family: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.family == 'iPad' && '["iPad"]' || github.event_name == 'workflow_dispatch' && inputs.family == 'iPhone' && '["iPhone"]' || '["iPhone","iPad"]') }}
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          python3 tools/icon.py
          xcodegen generate
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build iPhone and iPad arm64 IPA
        if: matrix.family == 'iPhone'
        timeout-minutes: 10
        run: |
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device -disableAutomaticPackageResolution -skipPackageUpdates CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 build > build-device.log 2>&1 || { tail -n 160 build-device.log; exit 1; }
          python3 tools/package_ipa.py build/device/Build/Products/Release-iphoneos/ScanCenter.app dist
      - name: Compile simulator and UI checks
        timeout-minutes: 8
        run: |
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO ARCHS=$(uname -m) build-for-testing > build-compile.log 2>&1 || { tail -n 160 build-compile.log; exit 1; }
      - name: Boot one simulator
        timeout-minutes: 8
        run: |
          xcrun simctl shutdown all
          if [ '${{ matrix.family }}' = 'iPad' ]; then
            python3 -u tools/simulator.py --family iPad --model-prefix 'iPad mini' --major 26 > /tmp/scan-center-device
          else
            python3 -u tools/simulator.py --family iPhone --major 26 > /tmp/scan-center-device
          fi
      - name: Verify visible screens and PDF behavior
        timeout-minutes: 10
        run: |
          DEVICE=$(cat /tmp/scan-center-device)
          set +e
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/tests.xcresult -parallel-testing-enabled NO CODE_SIGNING_ALLOWED=NO test-without-building > build-test.log 2>&1
          RESULT=$?
          set -e
          tail -n 100 build-test.log
          exit "$RESULT"
      - name: Export actual UI screenshots
        if: always()
        run: |
          if [ -d build/tests.xcresult ]; then
            mkdir -p dist
            xcrun xcresulttool export attachments --path build/tests.xcresult --output-path dist/attachments
            python3 tools/export_previews.py '${{ matrix.family }}'
          fi
      - name: Upload IPA and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScanCenter-${{ matrix.family }}
          path: |
            dist/
            build-test.log
            build-device.log
            build-compile.log
          retention-days: 14

