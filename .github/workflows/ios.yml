name: Build iOS IPA
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Generate Xcode project
        run: |
          brew install xcodegen
          python3 tools/icon.py
          xcodegen generate
          xcodebuild -version
      - name: Build and test simulator
        run: |
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -destination 'generic/platform=iOS Simulator' -derivedDataPath build/simulator CODE_SIGNING_ALLOWED=NO ARCHS=$(uname -m) build-for-testing > build-test.log 2>&1 || { tail -n 160 build-test.log; exit 1; }
          python3 tools/simulator.py > /tmp/scan-center-simulator
          DEVICE=$(cat /tmp/scan-center-simulator)
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -destination "platform=iOS Simulator,id=$DEVICE" -derivedDataPath build/simulator -resultBundlePath build/tests.xcresult CODE_SIGNING_ALLOWED=NO test-without-building >> build-test.log 2>&1 || { tail -n 160 build-test.log; exit 1; }
          xcrun simctl install "$DEVICE" build/simulator/Build/Products/Debug-iphonesimulator/ScanCenter.app
          xcrun simctl launch "$DEVICE" cyou.actart.scancenter
          sleep 4
          mkdir -p dist
          xcrun simctl io "$DEVICE" screenshot dist/iPhone.png
      - name: Build iPhone and iPad arm64 app
        run: |
          xcodebuild -project ScanCenter.xcodeproj -scheme ScanCenter -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO ARCHS=arm64 build > build-device.log 2>&1 || { tail -n 160 build-device.log; exit 1; }
          python3 tools/package_ipa.py build/device/Build/Products/Release-iphoneos/ScanCenter.app dist
      - name: Upload IPA and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ScanCenter-iOS
          path: |
            dist/
            build-test.log
            build-device.log
          retention-days: 14

